name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: 'Optional SHA of an interrupted Pages deployment to cancel'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cancel an interrupted Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGES_DEPLOYMENT_ID: ${{ inputs.cancel_deployment }}
        run: gh api --method POST "repos/$GH_REPO/pages/deployments/$PAGES_DEPLOYMENT_ID/cancel"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --include=dev
      - name: Build frontend for Pages
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_GITHUB_PAGES: 'true'
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload frontend
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: Frontend/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
